name: Finalize Windows Editorial Pro source

on:
  push:
    branches:
      - release/windows-editorial-pro
    paths:
      - '.github/msp-publish/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          required=(
            .github/msp-publish/xaml.part.00
            .github/msp-publish/cs.part.00
            .github/msp-publish/cs.part.01
            .github/msp-publish/html.part.00
            .github/msp-publish/html.part.01
            .github/msp-publish/html.part.02
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo 'complete=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'complete=true' >> "$GITHUB_OUTPUT"

      - name: Restore final Windows files
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          cat .github/msp-publish/xaml.part.* | base64 -d | gzip -d > windows/MarkdownStudioPro.WinUI/MainWindow.xaml
          cat .github/msp-publish/cs.part.* | base64 -d | gzip -d > windows/MarkdownStudioPro.WinUI/MainWindow.xaml.cs
          cat .github/msp-publish/html.part.* | base64 -d | gzip -d > windows/MarkdownStudioPro.WinUI/App/editor.html
          rm -rf .github/msp-publish

      - name: Commit final source
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/MarkdownStudioPro.WinUI/MainWindow.xaml windows/MarkdownStudioPro.WinUI/MainWindow.xaml.cs windows/MarkdownStudioPro.WinUI/App/editor.html .github/msp-publish
          git commit -m 'Publish final Windows Editorial Pro source'
          git push
